<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side Runner MVP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <div class="brand">Side Runner</div>
        <div class="controls">
          <span>Move: A / D</span>
          <span>Jump: W / Space</span>
          <span>Shoot: J / K</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <div class="hud">
          <div class="hud-box">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="score">0</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">Best</span>
            <span class="hud-value" id="best">0</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">HP</span>
            <span class="hud-value" id="hp">5 / 5</span>
          </div>
        </div>

        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div class="notice" id="notice">Move: A / D or ← / →   Jump: W / ↑ / Space   Shoot: J / K</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
